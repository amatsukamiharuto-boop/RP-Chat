name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p "$RUNNER_TEMP/keep"
          cp -r lib pubspec.yaml "$RUNNER_TEMP/keep/"
          flutter create --platforms=android --org com.example --project-name rp_gemini .
          rm -rf lib pubspec.yaml test
          cp -r "$RUNNER_TEMP/keep/lib" "$RUNNER_TEMP/keep/pubspec.yaml" .

      - name: Allow internet access, voice (TTS), and set app name
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE"\/><\/intent><\/queries>\n    <application/' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="RP Gemini"/' "$MANIFEST"
          grep -n "INTERNET\|TTS_SERVICE" "$MANIFEST"

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rp-gemini-apk
          path: build/app/outputs/flutter-apk/app-release.apk
